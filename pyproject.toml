# Project + tool configuration for SparseGF2.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsegf2"
dynamic = ["version"]
description = "Phase-free sparse stabilizer simulator over GF(2)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "sjbevins", email = "sjbevins64@gmail.com" },
]
keywords = [
    "stabilizer-simulator",
    "clifford",
    "GF(2)",
    "MIPT",
    "measurement-induced-phase-transition",
    "quantum-information",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    # Hard runtime floor: both are imported unconditionally in core/.
    # Upper bounds are conservative: numba 0.70 plans to tighten
    # ``cache=True`` invalidation rules and drop reflected lists;
    # numpy 3.0 has no known release date but reserved for future
    # API changes. Bump these in a dedicated PR after a green CI run
    # against the new versions.
    "numpy>=2.0,<3.0",
    "numba>=0.60,<0.70",
]

[project.urls]
Homepage = "https://github.com/sjbevins/SparseGF2"
Repository = "https://github.com/sjbevins/SparseGF2"
Issues = "https://github.com/sjbevins/SparseGF2/issues"
Changelog = "https://github.com/sjbevins/SparseGF2/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Just the test runner. The suite runs without Stim: the Stim-parity tests
# skip via pytest.importorskip("stim"). Add the `stim` extra to run them.
test = [
    "pytest>=8",
]
# Optional ground-truth cross-checker for the RREF parity tests and the
# SparseGF2-vs-Stim benchmarks. Never imported from runtime code; kept separate
# so the simulator and test suite install on any supported Python even when
# Stim has no wheel for it yet.
stim = [
    "stim>=1.15",
]
lint = [
    "ruff>=0.5",
]
notebook = [
    "ipykernel",
    "jupyter",
    "nbformat",
    "nbclient",
]
# Circuit-diagram drawer (sparsegf2.circuits.draw). Optional and lazily
# imported, so the runtime simulator floor stays numpy + numba.
viz = [
    "matplotlib>=3.7",
]
# Arbitrary-geometry circuits (sparsegf2.circuits.from_networkx). Lazily
# imported; only needed to build a topology from a networkx graph.
graph = [
    "networkx>=3",
]
# On-disk sweep output + dataframes (sparsegf2.analysis): parquet rows, HDF5
# tableaux, and SweepResult.to_pandas(). All lazily imported.
data = [
    "pyarrow>=15",
    "h5py>=3.10",
    "pandas>=2.0",
]
# Parallel sweep workers (sparsegf2.analysis.sweep(n_jobs>1)). Lazily imported.
parallel = [
    "joblib>=1.3",
]
# Live progress bar for sweeps / studies (sweep(progress=True)). Lazily imported
# via tqdm.auto (Jupyter widget or terminal bar); ipywidgets gives the richer
# notebook widget but tqdm degrades to a text bar without it.
progress = [
    "tqdm>=4",
    "ipywidgets>=8",
]
# The full analysis layer (sweep + on-disk output + arbitrary geometry + bars).
analysis = [
    "sparsegf2[data,parallel,graph,progress]",
]
# Convenience union that pulls everything needed to develop on the workspace.
dev = [
    "sparsegf2[test,lint,notebook,viz,analysis]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker so downstream mypy/pyright consume our annotations.
sparsegf2 = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "sparsegf2._version.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules
]
ignore = [
    "E501",  # line-too-long, handled by formatter
    "B008",  # function-call-in-default-argument, common with numpy defaults
]

[tool.ruff.lint.per-file-ignores]
# E402: tests do `pytest.importorskip("stim")` before importing test helpers
# that themselves import stim; the late import is intentional.
"tests/**/*.py" = ["B011", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["sparsegf2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = "test_*.py"
norecursedirs = [".venv"]
