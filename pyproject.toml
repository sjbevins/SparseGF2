# SparseGF2 3.x. The deprecated v2 package (same import name) is preserved at
# the tag v2.0.0 and the branch v2-legacy; do not install both in one environment.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsegf2"
dynamic = ["version"]
description = "SparseGF2: a fast stabilizer-circuit simulator for monitored Clifford circuits, verified against Stim."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sjbevins", email = "sjbevins64@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    # The simulation kernels (milestone 2 onward) are Numba-compiled.
    "numba>=0.59",
]

[project.optional-dependencies]
# Stim is the reference oracle for the whole test suite, so it is required
# for testing (tests fail, rather than skip, when it is missing). It is never
# imported by the simulator at runtime.
# matplotlib: docs/GETTING_STARTED.md draws its heatmaps, and tests/test_docs.py
# executes that guide (the simulator itself never imports matplotlib).
# networkx: graphs.from_networkx is tested against the real library (the test
# fails, rather than skips, when it is missing).
# hypothesis: property-based tests of the simulator and its analysis helpers.
# pytest-cov: coverage reports in CI.
test = [
    "pytest>=8",
    "stim>=1.15",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "hypothesis>=6.100",
    "pytest-cov>=5",
]
lint = ["ruff>=0.5"]
# The MCP server for LLM agents (sparsegf2-mcp). Imported only by mcp_server.py,
# so the simulator itself never needs it.
mcp = ["mcp>=2.2", "pydantic>=2"]
dev = ["sparsegf2[test,lint,mcp]"]

[project.scripts]
sparsegf2 = "sparsegf2.cli:main"
sparsegf2-mcp = "sparsegf2.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparsegf2 = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "sparsegf2._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# Lets `pytest` run from this directory even before `pip install -e .`.
pythonpath = ["src"]
addopts = "-q --doctest-modules --strict-markers"
# Warnings are errors, and an xfail that starts passing is a failure.
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Numba kernels: explicit loops compile to tighter machine code than
# generator expressions such as all(...), so keep them.
"src/sparsegf2/_kernel/*.py" = ["SIM108", "SIM109", "SIM110"]

[tool.ruff.lint.isort]
known-first-party = ["sparsegf2"]
