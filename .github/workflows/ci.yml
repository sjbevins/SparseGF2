name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, [${{ matrix.extras }}])
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        # Two install configs on every OS: the bare numpy+numba floor (extra
        # tests skip), and the full set that exercises analysis/parallel/data/
        # graph/progress + plotting + the Stim-parity cross-checks.
        extras: ["test,lint", "test,lint,stim,analysis,viz"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Lint (ruff check)
        run: ruff check src/ tests/

      - name: Format check (ruff format --check)
        run: ruff format --check src/ tests/

      - name: pytest
        run: python -m pytest -q tests/

      - name: pytest -O (stripped-assert smoke)
        # Catches paths where a production-critical check was written
        # with `assert` instead of `raise`.
        run: python -O -m pytest -q tests/
