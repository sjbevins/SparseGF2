name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Stim is a required test dependency: the suite fails rather than skips
    # without it.
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest # the supported floor
            python-version: "3.11"
          - os: windows-latest # the main research workstation
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint,mcp]"

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Format check (ruff format --check)
        run: ruff format --check src tests

      - name: pytest
        run: python -m pytest
